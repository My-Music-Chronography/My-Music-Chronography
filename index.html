<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Music Chronography</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Music Chronography">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#efeadf; --ink:#2b2620; --muted:#8a8378; --panel:#ffffff; --unread:#e3ddce; --red:#aa3333;
    --band:#6b4a32; --hdr-cell:#d9d0be;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{overscroll-behavior-y:none;}
  body{margin:0; font-family:Georgia,'Times New Roman',serif; background:var(--bg); color:var(--ink); min-height:100vh;
    padding:calc(var(--header-h,90px) + 4px) 4px calc(var(--footer-h,60px) + 4px);}
  body.no-foot{padding-bottom:calc(16px + env(safe-area-inset-bottom));}
  button,input,select{font:inherit; color:inherit;}
  button{cursor:pointer;}
  #app{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:4px;}

  /* ---- frozen header: page tabs, then the search + sort/filter card ---- */
  #app-header{position:fixed; top:0; left:0; right:0; z-index:9; display:flex; flex-direction:column; gap:4px;
    padding:0 0 4px; background:var(--band); border-top:3px solid #000; border-bottom:3px solid #000;}
  #app-header.bare{padding-bottom:0;}
  #tabs{display:flex; gap:4px; padding:calc(4px + env(safe-area-inset-top)) 4px 4px; background:var(--ink); border-bottom:3px solid #000;}
  #app-header.bare #tabs{border-bottom:none;}
  #tabs .tab{flex:1 1 0; height:34px; display:flex; align-items:center; justify-content:center; border:2.5px solid #000; border-radius:6px;
    background:#fff; color:var(--ink); font:700 min(.74rem, 2.95vw)/1.1 Arial,sans-serif; text-transform:uppercase; cursor:pointer; user-select:none;}
  #tabs .tab.active{background:var(--cloth); color:#fff;}
  .hdr-row{display:flex; gap:4px; margin:0 4px;}
  .hdr-row[hidden]{display:none;}
  #app-header::after, #app-footer::before{content:''; position:absolute; left:0; right:0; height:16px; pointer-events:none;}
  #app-header::after{top:100%; margin-top:1px; background:linear-gradient(180deg, rgba(0,0,0,.32), rgba(0,0,0,.12) 40%, rgba(0,0,0,0));}
  #app-footer::before{bottom:100%; margin-bottom:1px; background:linear-gradient(0deg, rgba(0,0,0,.32), rgba(0,0,0,.12) 40%, rgba(0,0,0,0));}

  /* search + sort/filter card */
  #sf-card{flex:1; position:relative; display:flex; align-items:center; justify-content:center; gap:5px; height:45px; padding:0 40px;
    border:3px solid #000; border-radius:8px; cursor:pointer; user-select:none; white-space:nowrap; overflow:hidden;
    --l:var(--ink); --r:var(--panel);
    background:linear-gradient(to right, var(--l) 0 39px, var(--panel) 39px calc(100% - 39px), var(--r) calc(100% - 39px)) border-box;
    font:700 min(.74rem,2.95vw) Arial,sans-serif; text-transform:uppercase;}
  #sf-card .sk{color:var(--muted);} #sf-card .sv{color:var(--ink); overflow:hidden; text-overflow:ellipsis;}
  #sf-card .dir{display:inline-block; width:10px; height:10px; flex:none;}
  #sf-card .dir svg{width:100%; height:100%; display:block; transition:transform .2s;}
  #sf-card .dir.up svg{transform:rotate(180deg);}
  #sf-search, #sf-close{position:absolute; top:0; bottom:0; width:36px; display:flex; align-items:center; justify-content:center;}
  #sf-search{left:0; border-right:3px solid #000;} #sf-close{right:0; border-left:3px solid #000; display:none;}
  #sf-search svg, #sf-close svg{width:16px; height:16px; display:block;}
  #sfq{position:absolute; left:36px; right:36px; top:0; bottom:0; display:none; margin:0; padding:0 8px; border:0; outline:0; background:transparent;
    font:600 .9rem Georgia,serif; text-transform:none;}
  #sf-card.searching{--r:#7a2f2b; cursor:text;}
  #sf-card.searching .sl{visibility:hidden;}
  #sf-card.searching #sf-close{display:flex;}
  #sf-card.searching #sfq{display:block;}
  #sf-card.has-q:not(.searching){--r:#7a2f2b;}
  #sf-card.has-q:not(.searching) #sf-close{display:flex;}
  .sl{display:flex; gap:5px; min-width:0; align-items:center;}

  /* ---- frozen footer: Add New Album ---- */
  #app-footer{position:fixed; left:0; right:0; bottom:0; z-index:9; display:flex; flex-direction:column; gap:4px;
    padding:4px 4px calc(4px + env(safe-area-inset-bottom)); background:var(--band); border-top:3px solid #000; border-bottom:3px solid #000;}
  #app-footer[hidden]{display:none;}
  .add-card{display:flex; align-items:center; justify-content:center; gap:10px; height:45px; border:3px solid #000; border-radius:8px; cursor:pointer;
    background:#5b6633; color:#fff; font:700 min(1rem, 4vw)/1 Georgia,'Times New Roman',serif; letter-spacing:.14em; text-transform:uppercase; user-select:none;}
  .add-card b{font-size:1.15em;}
  .add-card:active{filter:brightness(.92);}

  /* ---- shared GT50 pieces ---- */
  .list-divider{display:flex; align-items:center; gap:10px; height:45px; padding:0 4px;}
  .list-divider::before, .list-divider::after{content:''; flex:1; height:3px; background:#000; border-radius:2px;}
  .list-divider span{font:600 .9rem Georgia,serif; text-transform:uppercase; letter-spacing:.5px; max-width:75%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .list-divider.sm{height:28px;} .list-divider.sm span{font-size:.78rem;}
  .empty{padding:40px 12px; text-align:center; font:.8rem/1.5 Arial,sans-serif; color:var(--muted);}
  .note{font:.66rem/1.45 Arial,sans-serif; color:var(--muted); padding:2px 6px; text-align:center;}
  .note a{color:var(--ink);}
  .seg{display:flex; height:45px; flex:none; border:3px solid #000; border-radius:8px; overflow:hidden; background:#000; gap:3px;}
  .seg button{flex:1; min-width:0; margin:0; padding:0 4px; border:0; border-radius:0; background:var(--hdr-cell); color:var(--ink);
    font:700 min(.78rem,3.1vw) Arial,sans-serif; letter-spacing:.4px; text-transform:uppercase; white-space:nowrap;}
  .seg button.on{background:var(--ink); color:#fff;}
  .spin{display:inline-block; width:14px; height:14px; border:3px solid var(--unread); border-top-color:var(--ink); border-radius:50%;
    animation:sp 1s linear infinite; vertical-align:-2px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed; left:50%; top:calc(var(--header-h,90px) + 8px); transform:translate(-50%,-20px); opacity:0; z-index:80;
    background:var(--ink); color:#fff; border:3px solid #000; border-radius:8px; padding:10px 16px; font:.8rem Arial,sans-serif;
    pointer-events:none; transition:opacity .2s, transform .2s; max-width:90vw; text-align:center;}
  .toast.show{opacity:1; transform:translate(-50%,0);}

  /* cover art: a square; when there's no picture, the album's color with its initials and a record */
  .art{flex:none; position:relative; background-color:var(--c,#555); background-size:cover; background-position:center; overflow:hidden;}
  .art.ph{background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 1px, transparent 1px 9px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4%; color:#f3eee4;}
  .art.ph span{font:700 calc(var(--sz,56px) * .34)/1 Georgia,serif; letter-spacing:-.02em;}
  .art.ph svg{width:30%; height:30%; display:block;}
  .art.round{border-radius:50%;}

  /* ---- album cards ---- */
  .alb{position:relative; display:flex; align-items:stretch; height:62px; background:var(--panel); border-radius:8px; overflow:hidden; cursor:pointer; user-select:none;}
  .alb::after{content:''; position:absolute; inset:0; border:3px solid #000; border-radius:8px; pointer-events:none; z-index:2;}
  .alb:active{filter:brightness(.96);}
  .alb .art{width:62px; --sz:62px; border-right:3px solid #000;}
  .alb .main{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:2px; padding:0 10px; line-height:1.15;}
  .t{font:600 .9rem Georgia,serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .a{font:.68rem Arial,sans-serif; color:rgba(43,38,32,.75); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .m{font:700 .56rem Arial,sans-serif; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ty{flex:none; width:40px; display:flex; align-items:center; justify-content:center; border-left:3px solid #000; background:var(--tc);}
  .ty span{writing-mode:vertical-rl; transform:rotate(180deg); font:700 .66rem/1 Arial,sans-serif; letter-spacing:1.2px; color:#fff; text-transform:uppercase;}
  .hit{font:italic .62rem Arial,sans-serif; color:#7a2f2b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ---- artist cards (the artist list) ---- */
  .art-card{position:relative; display:flex; align-items:stretch; height:56px; background:var(--panel); border-radius:8px; overflow:hidden; cursor:pointer; user-select:none;}
  .art-card::after{content:''; position:absolute; inset:0; border:3px solid #000; border-radius:8px; pointer-events:none; z-index:2;}
  .art-card .art{width:56px; --sz:56px; border-right:3px solid #000;}
  .art-card .main{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:3px; padding:0 10px; line-height:1.15;}
  .art-card .cnt{flex:none; width:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-left:3px solid #000; background:var(--unread);
    font:700 1.05rem/1 Georgia,serif;}
  .art-card .cnt small{font:700 .46rem Arial,sans-serif; letter-spacing:.6px; color:var(--muted); text-transform:uppercase; margin-top:3px;}
  .art-card:active{filter:brightness(.96);}
  .art.photo{background-color:var(--unread);}

  /* ---- the main window: one card per artist; tap it and their albums drop down, oldest first ---- */
  .ac{background:var(--panel); border:3px solid #000; border-radius:8px; overflow:hidden;}
  .ac-head{display:flex; align-items:stretch; height:39px; cursor:pointer; user-select:none;}   /* 45px with the card's border */
  .ac-head:active{filter:brightness(.96);}
  .ac-head .art{width:42px; --sz:42px; border-right:3px solid #000;}
  .ac-head .art.ph svg{display:none;}
  .ac-head .main{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:1px; padding:0 10px; line-height:1.15;}
  .ac-head .t{font-size:.9rem;}
  .ac-head .m{font-size:.52rem;}
  .ac-head .cnt{flex:none; width:52px; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:6px; border-left:3px solid #000; background:var(--unread);
    font:700 .9rem/1 Georgia,serif; transition:background .2s, color .2s;}
  .ac-head .cnt svg{width:10px; height:10px; display:block; transition:transform .25s;}
  .ac.open .ac-head .cnt{background:var(--ink); color:#fff;}
  .ac.open .ac-head .cnt svg{transform:rotate(180deg);} .ac.open .ac-head .cnt polygon{fill:#fff; stroke:#fff;}
  .ac-drop{display:grid; grid-template-rows:0fr; transition:grid-template-rows .28s ease;}
  .ac.open .ac-drop{grid-template-rows:1fr;}
  .ac-in{min-height:0; overflow:hidden;}
  .ac-list{display:flex; flex-direction:column; gap:4px; padding:4px; border-top:3px solid #000; background:var(--unread);}
  /* a dropdown album: one 28px line — cover, title, year · length, type */
  .alb.mini{height:28px; border-radius:6px;} .alb.mini::after{border-radius:6px;}
  .alb.mini .art{width:25px; --sz:25px; border-right-width:3px;} .alb.mini .art.ph svg, .ac-head .art.ph svg{display:none;} .alb.mini .art.ph, .ac-head .art.ph{gap:0;} .alb.mini .art.ph span{font-size:.62rem;}
  .alb.mini .main{flex-direction:row; align-items:center; gap:8px; padding:0 8px;}
  .alb.mini .t{flex:1; min-width:0; font-size:.78rem;}
  .alb.mini .m, .alb.mini .hit{flex:none; max-width:45%; font-size:.5rem;}
  .alb.mini .hit{font-size:.6rem;}
  .alb.mini .ty{width:44px; border-left-width:3px;} .alb.mini .ty span{writing-mode:horizontal-tb; transform:none; font-size:.5rem; letter-spacing:.8px;}
  .ac-page{height:28px; margin:0; border:3px solid #000; border-radius:6px; background:#fff; font:700 .62rem Arial,sans-serif; letter-spacing:.8px; text-transform:uppercase; color:var(--ink);}
  .ac-page:active{background:var(--bg);}
  @media (prefers-reduced-motion:reduce){ .ac-drop{transition:none;} }
  /* the artist window: their photo, and where it came from */
  .gtags{display:flex; flex-wrap:wrap; gap:4px;}
  .gtags span{height:24px; display:flex; align-items:center; padding:0 9px; background:#fff; border:3px solid #000; border-radius:6px;
    font:700 .58rem Arial,sans-serif; letter-spacing:.6px; text-transform:uppercase;}
  .ph-btns{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px;}
  .ph-src{font:700 .5rem Arial,sans-serif; letter-spacing:.7px; text-transform:uppercase; color:var(--muted);}

  /* ---- full-window pages (sort, add/edit, album, artist, artist list) ---- */
  .page{position:fixed; inset:0; z-index:40; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch;
    opacity:0; visibility:hidden; transition:opacity 180ms ease, visibility 0s linear 180ms;}
  .page.open{opacity:1; visibility:visible; transition:opacity 180ms ease, visibility 0s;}
  #ap-page{z-index:50;} #al-page{z-index:42;} #ar-page{z-index:41;} #ed-page{z-index:45;}
  .pg-head{position:sticky; top:0; z-index:5; display:flex; gap:3px; padding-top:env(safe-area-inset-top); background:#000; border-top:3px solid #000; border-bottom:3px solid #000;}
  .pg-head button{flex:0 0 25%; height:42px; margin:0; padding:0 2px; border:0; border-radius:0; background:#7a2f2b; color:#fff;
    font:700 min(.74rem, 2.95vw)/1.1 Arial,sans-serif; text-transform:uppercase; cursor:pointer;}
  .pg-head button.go{background:#2e4636;}
  .pg-head button.go:disabled{background:#4c5a50; color:rgba(255,255,255,.45); cursor:default;}
  .pg-head button.blank{background:var(--hdr-cell); color:transparent; pointer-events:none;}
  .pg-head h2:has(+ .blank){margin-right:-3px;}   /* no right-hand button: the title cell runs to the edge, still centered */
  .pg-head h2{flex:1; min-width:0; margin:0; height:42px; padding:0 8px; background:var(--hdr-cell); text-align:center;
    font:700 min(.74rem, 2.95vw)/42px Arial,sans-serif; text-transform:uppercase; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pg-body{display:flex; flex-direction:column; gap:4px; padding:4px 4px calc(24px + env(safe-area-inset-bottom)); max-width:760px; margin:0 auto;}

  /* sort page options */
  .so-opt{display:flex; align-items:center; gap:8px; height:45px; margin:0; padding:0 10px; text-align:left; width:100%;
    background:var(--panel); border:3px solid #000; border-radius:8px; cursor:pointer; line-height:1.15;}
  .so-opt .tx{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:2px;}
  .so-opt b{font:700 .84rem Arial,sans-serif; letter-spacing:.4px; text-transform:uppercase; color:var(--ink);}
  .so-opt span{font:700 .56rem Arial,sans-serif; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .so-opt.on{background:var(--ink);} .so-opt.on b{color:#fff;} .so-opt.on span{color:#cfc8ba;}
  .so-opt i{flex:none; width:22px; height:22px; display:none;}
  .so-opt.on i{display:block;}
  .so-opt i svg{width:100%; height:100%; display:block; transition:transform .2s;}
  .so-opt i.up svg{transform:rotate(180deg);}

  /* add / edit: the record preview */
  .pv{display:flex; align-items:center; justify-content:center; height:206px; flex:none; position:relative;}
  .sleeve-wrap{position:relative; width:var(--s); height:var(--s); margin-right:calc(var(--s) * .42); transition:width .3s, height .3s, margin .3s;}
  .disc{position:absolute; top:3%; left:3%; width:94%; height:94%; border-radius:50%; transform:translateX(0);
    background:repeating-radial-gradient(circle at 50% 50%, #161412 0 1.4px, #26221f 1.4px 2.6px);
    box-shadow:0 2px 6px rgba(0,0,0,.35); transition:transform .55s cubic-bezier(.3,.9,.35,1);}
  .disc::before{content:''; position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 30deg, rgba(255,255,255,0) 0 40deg, rgba(255,255,255,.12) 55deg, rgba(255,255,255,0) 70deg 210deg, rgba(255,255,255,.1) 225deg, rgba(255,255,255,0) 240deg);}
  .disc .lbl{position:absolute; left:50%; top:50%; width:36%; height:36%; margin:-18% 0 0 -18%; border-radius:50%; background:var(--c,#7a2f2b); border:2px solid rgba(0,0,0,.35);}
  .disc .lbl::after{content:''; position:absolute; left:50%; top:50%; width:12%; height:12%; margin:-6% 0 0 -6%; border-radius:50%; background:var(--bg);}
  .pv.in .disc{transform:translateX(42%);}
  .sleeve{position:absolute; inset:0; border:3px solid #000; border-radius:4px; overflow:hidden; cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.25);}
  .sleeve .art{position:absolute; inset:0; width:100%; height:100%;}
  .sleeve .hint{position:absolute; left:0; right:0; bottom:0; padding:3px 0; background:rgba(0,0,0,.55); color:#fff; text-align:center;
    font:700 .52rem Arial,sans-serif; letter-spacing:.8px; text-transform:uppercase;}

  /* add / edit: fields */
  .fc{position:relative; display:flex; flex-direction:column; justify-content:center; height:48px; padding:0 10px; background:var(--panel);
    border:3px solid #000; border-radius:8px; min-width:0;}
  .fc label{font:700 .54rem Arial,sans-serif; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); line-height:1;}
  .fc input{width:100%; border:0; outline:0; background:none; padding:3px 0 0; font:600 .92rem Georgia,serif; color:var(--ink);}
  .fc input::placeholder{color:#c4bdb0; font-weight:400;}
  .fc.bad label{color:var(--red);}
  .row2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:4px;}
  .row-art{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:4px;}
  .card-btn{height:48px; margin:0; padding:0 6px; border:3px solid #000; border-radius:8px; background:var(--panel); color:var(--ink);
    font:700 min(.76rem,3vw) Arial,sans-serif; letter-spacing:.4px; text-transform:uppercase;}
  .card-btn.ink{background:var(--ink); color:#fff;}
  .card-btn:disabled{color:var(--muted); cursor:default;}
  .card-btn.ink:disabled{background:#6d665d; color:#cfc8ba;}
  .lk{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) 25%; gap:4px;}
  .lk-st{font:.72rem/1.4 Arial,sans-serif; color:var(--muted); text-align:center; padding:6px 8px;}
  .lk-st.err{color:var(--red);}
  .sr-list{border:3px solid #000; border-radius:8px; overflow:hidden; display:flex; flex-direction:column; gap:3px; background:#000;}
  .sr-list:empty{display:none;}
  .sr-sec{height:22px; display:flex; align-items:center; justify-content:space-between; padding:0 10px; background:var(--hdr-cell);
    font:700 .56rem Arial,sans-serif; letter-spacing:.8px; text-transform:uppercase; color:var(--ink);}
  .sr-sec span{color:rgba(43,38,32,.6);}
  .lk-row{display:flex; align-items:stretch; min-height:50px; margin:0; padding:0; border:0; border-radius:0; background:#fff; width:100%; text-align:left; color:var(--ink);}
  .lk-row .art{width:50px; --sz:50px; border-right:3px solid #000; background-color:var(--unread);}
  .lk-row .art img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;}
  .lk-row .tx{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:2px; padding:4px 10px;}
  .lk-row b{font:600 .86rem/1.15 Georgia,serif; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .lk-row small{font:.64rem/1.2 Arial,sans-serif; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lk-row .tg{flex:none; align-self:center; margin-right:8px; padding:2px 5px; border:2px solid currentColor; border-radius:5px; font:700 .5rem Arial,sans-serif; letter-spacing:.6px; text-transform:uppercase; color:var(--muted);}
  .lk-row:active{background:var(--unread);}
  .lk-row.busy .tg{border:0; padding:0;}
  .lk-type{height:34px;} .lk-type button{font-size:min(.66rem,2.7vw);}
  .lk-ck{flex:none; align-self:stretch; width:46px; display:grid; place-items:center; border-left:3px solid #000; background:var(--unread); cursor:pointer;}
  .lk-ck i{width:26px; height:26px; display:grid; place-items:center; border:3px solid #000; border-radius:50%; background:#fff;}
  .lk-ck svg{width:13px; height:13px; fill:none; stroke:#fff; stroke-width:3.6; stroke-linecap:round; stroke-linejoin:round; opacity:0;}
  .lk-row.sel .lk-ck{background:#5b6633;} .lk-row.sel .lk-ck i{background:var(--ink);} .lk-row.sel .lk-ck svg{opacity:1;}
  .lk-row.sel{background:#f3f1e6;}

<body>
<!-- The opening: picks up exactly where Android's own launch screen (the icon on tan) leaves off. Two records from the pile,
     chosen at random, swing out to frame the screen top and bottom; the other two pause half off the sides, then become
     the O's of CHRONOGRAPHY as the name slams in. About 5 seconds, every time the app opens; tap to skip. -->
<style>
  #spl{position:fixed; inset:0; z-index:1000; background:#efeadf; overflow:hidden; transition:opacity .45s ease;}
  #spl.gone{opacity:0; pointer-events:none;}
  #spl svg{position:absolute; inset:0; width:100%; height:100%; display:block;}
</style>
<div id="spl"><svg id="spl-svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script>
(()=>{'use strict';
const NS='http://www.w3.org/2000/svg';
const C={red:'#7a2f2b',blue:'#2e3d6b',teal:'#2b5752',olive:'#8a7a33',plum:'#66304c',rust:'#86452b',wood:'#8a6a3f',woodD:'#6b4a32',cream:'#e3ddce',bg:'#efeadf',ink:'#2b2620',muted:'#8a8378'};
const LABELS=[C.red,C.blue,C.teal,C.olive,C.plum,C.rust];
const SERIF="Georgia,'Times New Roman',serif",SANS='Arial,Helvetica,sans-serif',MONO="'Courier New',Courier,monospace";
const TAG='COLLECT · LISTEN · REMEMBER';
/* ---------- small helpers ---------- */
let UID=0;const uid=p=>p+(++UID);
function mk(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e}
function tx(par,str,at){const e=mk('text',at,par);e.textContent=str;return e}
const tf=(e,x,y,r=0,sx=1,sy=sx)=>e.setAttribute('transform',`translate(${x} ${y}) rotate(${r}) scale(${sx} ${sy})`);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const io=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, out=t=>1-Math.pow(1-t,3), inn=t=>t*t*t, back=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const bounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375};
function meshDef(defs,col='#000',op=.55,size=9){const id=uid('m');const p=mk('pattern',{id,patternUnits:'userSpaceOnUse',width:size,height:size,patternTransform:'rotate(45)'},defs);
  mk('path',{d:`M0 0H${size}M0 0V${size}`,stroke:col,'stroke-width':1.6,'stroke-opacity':op},p);return `url(#${id})`}
// a record centered on 0,0: g (place/scale it) > sp (spin it) > disc, grooves, shine, label, hole
function recEl(par,r,label,o={}){
  const g=mk('g',{},par),sp=mk('g',{},g),sw=o.sw??Math.max(8,r*.1);
  mk('circle',{r,fill:'#1c1916',stroke:'#000','stroke-width':sw},sp);
  for(let k=.88;k>.48;k-=.1)mk('circle',{r:r*k,fill:'none',stroke:'#3a3430','stroke-width':Math.max(1.5,r*.018)},sp);
  let shine=null;if(o.shine!==false){const a=r*.62;shine=mk('path',{d:`M${a*Math.cos(-2.2)} ${a*Math.sin(-2.2)} A${a} ${a} 0 0 1 ${a*Math.cos(-1.35)} ${a*Math.sin(-1.35)}`,fill:'none',stroke:'#fff','stroke-opacity':.22,'stroke-width':r*.07,'stroke-linecap':'round'},sp)}
  const lab=mk('circle',{r:r*.36,fill:label,stroke:'#000','stroke-width':Math.max(5,r*.06)},sp);
  const hole=mk('circle',{r:Math.max(4,r*.06),fill:C.bg},sp);
  return{g,sp,lab,hole,r,shine};
}
// where each letter of a word falls, so letters can be animated one by one
function charPos(par,str,size,font,weight,ls=0,fit=0){
  const m=mk('text',{x:0,y:0,'font-size':size,'font-family':font,'font-weight':weight,'letter-spacing':ls},par);m.textContent=str;
  let w=m.getComputedTextLength()||str.length*size*.64;
  if(fit&&w>fit){size*=fit/w;m.setAttribute('font-size',size);w=m.getComputedTextLength()||fit}
  const xs=[];for(let i=0;i<str.length;i++){try{const a=m.getStartPositionOfChar(i).x,b=m.getEndPositionOfChar(i).x;xs.push([a,b])}catch(e){xs.push([i*w/str.length,(i+1)*w/str.length])}}
  m.remove();return{size,w,xs};
}
const wipe=(defs)=>{const id=uid('w'),cp=mk('clipPath',{id},defs),r=mk('rect',{x:-5000,y:-5000,width:0,height:10000},cp);return{url:`url(#${id})`,r}};


/* 8 — records peel off the pile and flip face-on; two become the O's of CHRONOGRAPHY,
   the other two swing out to frame the screen: one as a giant half-record across the top, one across the bottom */
const IC=({name:'Record Stack',note:'Two random records frame the screen top and bottom; the other two become the O’s.',style:'Records as the O’s, a third of a record framing top and bottom',
build(root,U,defs){const o={};const lay=[[376,C.teal,-34],[292,C.olive,30],[208,C.blue,-22],[124,C.red,14]];
  o.layer=mk('g',{},root);   // the records' own layer, under the words
  o.sl=lay.map(([y,c,dx])=>{const x=256+dx,g=mk('g',{},o.layer);
    const band=mk('path',{fill:'#1c1916',stroke:'#000','stroke-width':10,'stroke-linejoin':'round'},g);
    const f=mk('g',{},g);const r=recEl(f,150,c,{sw:10});
    return{g,band,f,r,x,y}});
  // a new shuffle every time it plays: the first two frame the screen (top, bottom), the other two become the O's
  const order=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  o.role={};o.role[order[0]]='top';o.role[order[1]]='bottom';o.role[order[2]]='o1';o.role[order[3]]='o2';
  o.vy=Math.random()<.5?-1:1;   // which side record pauses above the middle and which below (always opposite)
  const Y=316,cp=charPos(root,'CHRONOGRAPHY',112,SERIF,700,0,(U.r-U.l)-60),x0=256-cp.w/2;o.Y=Y;o.L=[];o.O=[];
  'CHRONOGRAPHY'.split('').forEach((ch,i)=>{const [a,b]=cp.xs[i],cx=x0+(a+b)/2;if(ch==='O'){o.O.push({cx,cy:Y-cp.size*.35,r:cp.size*.335});return}
    o.L.push({cx,e:tx(root,ch,{x:cx,y:Y,'text-anchor':'middle','font-family':SERIF,'font-weight':700,'font-size':cp.size,fill:C.ink,opacity:0})})});
  o.my=tx(root,'MY  MUSIC',{x:256,y:Y-cp.size-22,'text-anchor':'middle','font-family':SANS,'font-weight':700,'font-size':30,'letter-spacing':16,fill:C.red,opacity:0});
  o.tag=tx(root,TAG,{x:256,y:Y+64,'text-anchor':'middle','font-family':SANS,'font-weight':700,'font-size':19,'letter-spacing':5,fill:C.muted,opacity:0});
  o.big=((U.r-U.l)/2)/150*1.04;   // a record as wide as the screen; a third of it shows
  return o},
// one record: its face squashed to sy (40/150 lying flat, 1 face-on); the edge's thickness thins away as it turns to face us
setRec(s,x,y,sc,sy,rot){const ry=150*sy,th=20*Math.max(0,1-(sy-40/150)/(1-40/150)*1.6);
  s.band.setAttribute('d',`M-150 0 A150 ${ry} 0 0 0 150 0 V${th} A150 ${ry} 0 0 1 -150 ${th} Z`);s.band.setAttribute('opacity',th>.5?1:0);
  s.g.setAttribute('transform',`translate(${x} ${y}) scale(${sc})`);s.f.setAttribute('transform',`scale(1 ${sy})`);s.r.sp.setAttribute('transform',`rotate(${rot})`)},
frame(t,o,U){
  // first two swing out to frame the screen, a third of each showing; then the other two flip over to become the O's
  const flat=40/150,big=o.big;
  // Each record follows one smooth curve: out sideways from its place in the pile (so it never cuts across the ones above it),
  // then round to its spot. Position, size, the flip to face-on and the spin all run off the same eased clock,
  // so nothing changes speed with a jolt. It comes to the front only once it's well clear of the pile.
  const ss=x=>x*x*(3-2*x);                                    // smoothstep
  const spinFrom=(t,st,w,ramp=.5)=>{const d=t-st;return d<=0?0:d<ramp?w*d*d/(2*ramp):w*(d-ramp/2)};   // a steady spin that eases in
  const bez=(a,b,c,d,u)=>{const v=1-u;return v*v*v*a+3*v*v*u*b+3*v*u*u*c+u*u*u*d};
  const ST={top:.25,bottom:.4,o1:1.0,o2:1.0};
  o.sl.forEach((s,i)=>{const role=o.role[i],frame=role==='top'||role==='bottom';
    const st=ST[role],side=(role==='top'||role==='o2')?1:-1;
    // the pile settles: when a record under this one leaves, this one eases down into the gap
    let y0=s.y;for(let j=0;j<i;j++){const d=ST[o.role[j]]+.3;y0+=84*io(P(t,d,d+.5))}
    let x=s.x,y=y0,sc=1,sy=flat,rot=0;
    if(frame){
      // out to the side, then a long run straight up (or down) still lying flat; it only flips face-on and grows near the edge
      const top=role==='top',u=io(P(t,st,st+1.15)),R=150*big,ty=top?U.t-R*.25:U.b+R*.25;   // a third and a sliver: just enough to see the label's color
      x=bez(s.x,s.x+side*300,256+side*40,256,u);y=bez(y0,y0+(top?-40:40),ty+(top?160:-160),ty,u);
      const f=ss(P(u,.5,.95));sc=lerp(1,big,ss(P(u,.35,1))*.85+f*.15);sy=lerp(flat,1,f);
      // the record's own gleam (there from the icon's first frame) keeps spinning round, through the part that shows:
      // the top record turns one way, the bottom the other, so their gleams sweep by in opposite directions
      rot=(top?-1:1)*spinFrom(t,st,160)}
    else{
      // both swing out to the sides together, flipping face-on and growing, and sit partly off the screen like the top and
      // bottom ones (one above the middle, one below, opposite each other); then they sweep back in, shrinking into their O's
      const tg=o.O[role==='o1'?0:1],a=io(P(t,st,st+.65)),b=io(P(t,st+.8,st+1.5));
      const halfW=(U.r-U.l)/2,Rs=halfW*.5,scS=Rs/150,cy=(U.t+U.b)/2;
      const sxp=side>0?U.r+Rs*.24:U.l-Rs*.24,syp=cy+(role==='o1'?o.vy:-o.vy)*Math.min(150,(U.b-U.t)*.1);
      if(b<=0){x=bez(s.x,s.x+side*200,sxp-side*60,sxp,a);y=bez(y0,y0,syp,syp,a);sc=lerp(1,scS,ss(a));sy=lerp(flat,1,ss(P(a,.15,.85)));rot=side*200*a}
      else{x=bez(sxp,sxp-side*140,tg.cx+side*140,tg.cx,b);y=bez(syp,syp,tg.cy-90,tg.cy,b);sc=lerp(scS,tg.r/150,ss(b));sy=1;rot=side*(200+300*b)}
      rot+=spinFrom(t,st+.5,90,.6)}
    if(Math.abs(x-s.x)>260&&!s.up){s.up=1;o.layer.appendChild(s.g)}
    if(t<st&&s.up)s.up=0;
    this.setRec(s,x,y,sc,sy,rot);
  });
  o.L.forEach((l,i)=>{const q=P(t,2.3+i*.05,2.72+i*.05),s=lerp(1.7,1,out(q));l.e.setAttribute('opacity',q);l.e.setAttribute('transform',`translate(${l.cx} ${o.Y}) scale(${s}) translate(${-l.cx} ${-o.Y})`)});
  o.my.setAttribute('opacity',P(t,3.15,3.5));o.tag.setAttribute('opacity',P(t,3.4,3.8));
}});

const spl=document.getElementById('spl'),svg=document.getElementById('spl-svg');let raf=0,T0=0,o=null,U=null,ended=false;
// sized and placed to match Chrome's own launch screen: the icon is 71.1% of the screen's width, centered.
// Installed, the page starts below the status bar, so the picture shifts to sit where Chrome's was
function start(){
  const W=innerWidth,H=innerHeight,iw=Math.min(W,H/1.2)*.711,s=iw/512;
  const app=matchMedia('(display-mode: standalone)').matches,shift=app?Math.max(0,(screen.height-H)/2-24):0;
  U={l:-(W-iw)/2/s,r:512+(W-iw)/2/s,t:-((H-iw)/2+shift)/s,b:512+((H-iw)/2-shift)/s};
  svg.setAttribute('viewBox',`${U.l} ${U.t} ${U.r-U.l} ${U.b-U.t}`);
  const defs=mk('defs',{},svg),root=mk('g',{},svg);o=IC.build(root,U,defs);IC.frame(0,o,U);
  raf=requestAnimationFrame(tick);
}
function tick(now){if(!T0)T0=now;const t=(now-T0)/1000;IC.frame(t,o,U);
  if(t>4.7){end();return}raf=requestAnimationFrame(tick)}
function end(){if(ended)return;ended=true;spl.classList.add('gone');setTimeout(()=>{cancelAnimationFrame(raf);spl.remove()},470)}
spl.addEventListener('click',end);   // tap skips
start();
})();
</script>

<script>
'use strict';
/* ================= basics ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const TYPES=['Album','LP','EP','Single'];
const TYPE_PL={Album:'Albums',LP:'LPs',EP:'EPs',Single:'Singles'};
const TYPE_C={Album:'#2b2620',LP:'#7a2f2b',EP:'#2b5752',Single:'#8a6a3f'};
const CLOTHS=['#7a2f2b','#2b5752','#66304c','#303d66','#8a6a3f','#5b6633','#2e4636','#5d3a85','#86452b','#3a2f52','#2f5fae','#7a5a2b'];
function hash(s){let h=2166136261;for(const ch of String(s).toLowerCase())h=Math.imul(h^ch.codePointAt(0),16777619);return h>>>0}
const clothOf=s=>CLOTHS[hash(s)%CLOTHS.length];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ART_RE=/^(the|a|an)\s+/i;
const sortKey=s=>String(s||'').trim().replace(ART_RE,'').toLowerCase();
function initials(s){
  const SMALL=/^(of|and|the|a|an|in|on|to|for|at|by|&)$/i;
  let w=String(s||'').replace(ART_RE,'').split(/[\s\-_/]+/).filter(x=>/[\p{L}\p{N}]/u.test(x));
  if(w.length>2)w=[w[0],...w.slice(1).filter(x=>!SMALL.test(x))];
  const ch=x=>[...x].find(c=>/[\p{L}\p{N}]/u.test(c))||'';
  return (w.length>1?ch(w[0])+ch(w[1]):ch(w[0]||'?')).toUpperCase()||'?';
}
const DISC_SVG='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>';
function artHTML(a,extra='',st=''){
  if(a.cover)return `<div class="art ${extra}" style="${st}background-image:url('${a.cover.replace(/'/g,'%27')}')"></div>`;
  return `<div class="art ph ${extra}" style="${st}--c:${clothOf((a.title||'')+'|'+(a.artist||''))}"><span>${esc(initials(a.title))}</span>${DISC_SVG}</div>`;
}
const akey=n=>String(n||'Unknown Artist').trim().toLowerCase();
function artistArt(name){
  const e=S.artists[akey(name)];
  if(e&&e.photo)return `<div class="art photo" style="background-image:url('${e.photo.replace(/'/g,'%27')}')"></div>`;
  return `<div class="art ph" style="--c:${clothOf('artist|'+name)}"><span>${esc(initials(name))}</span>${DISC_SVG}</div>`}
// lengths in seconds; written m:ss, or h:mm:ss past an hour
function fmtLen(s){s=Math.round(s||0);if(!s)return '';const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`}
function fmtLong(s){s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.round(s%3600/60);return h?`${h}h ${m}m`:`${m}m`}
function parseLen(v){v=String(v||'').trim();if(!v)return 0;const p=v.split(':').map(x=>parseInt(x,10));if(p.some(isNaN))return 0;return p.reduce((t,x)=>t*60+x,0)}
const genresOf=a=>String(a.genre||'').split(',').map(x=>x.trim()).filter(Boolean);
const normGenres=v=>[...new Map(String(v||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>[x.toLowerCase(),x])).values()].join(', ');
const total=a=>(a.tracks||[]).reduce((t,x)=>t+(x.len||0),0);
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

/* ================= storage: IndexedDB, with localStorage as a fallback ================= */
const KEY='spin-tracker';
// Saved two ways, every time:
//  • localStorage: everything except the pictures (the way Stack Tracker and Pod Tracer save; small and dependable)
//  • IndexedDB: everything, pictures included
// Each write is checked to have finished. On start, the newer of the two is used, with pictures filled in from IndexedDB.
const Store={
  db:null,
  open(){return new Promise(ok=>{let done=false;const fin=()=>{if(!done){done=true;ok()}};setTimeout(fin,4000);
    try{const r=indexedDB.open(KEY,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');
      r.onsuccess=()=>{const db=r.result;this.db=db;db.onclose=()=>{if(this.db===db)this.db=null};db.onversionchange=()=>{db.close();if(this.db===db)this.db=null};fin()};
      r.onerror=fin;r.onblocked=fin}catch(e){fin()}})},
  async idbGet(){if(!this.db)await this.open();if(!this.db)return null;
    return new Promise(ok=>{try{const q=this.db.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)}catch(e){this.db=null;ok(null)}})},
  async idbSet(v){
    // the browser closes the connection while the app sits in the background, so a failed write reopens and tries once more
    for(let i=0;i<2;i++){if(!this.db)await this.open();if(!this.db)return false;
      try{if(await new Promise(res=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,'state');tx.oncomplete=()=>res(true);tx.onerror=tx.onabort=()=>res(false)}))return true}
      catch(e){this.db=null}}
    return false},
  lsGet(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},
  lsSet(v){const noPic=x=>typeof x==='string'&&x.startsWith('data:')?'':x;
    const slim={...v,albums:v.albums.map(a=>({...a,cover:noPic(a.cover)})),
      artists:Object.fromEntries(Object.entries(v.artists||{}).map(([k,e])=>[k,{...e,photo:noPic(e.photo)}]))};
    try{localStorage.setItem(KEY,JSON.stringify(slim));return true}catch(e){return false}},
  async load(){
    const [idb,ls]=[await this.idbGet(),this.lsGet()];
    const ok=x=>x&&Array.isArray(x.albums);
    if(!ok(ls))return ok(idb)?idb:null;
    if(!ok(idb))return ls;
    if((idb.savedAt||0)>=(ls.savedAt||0))return idb;
    // the localStorage copy is newer: use it, with the pictures from IndexedDB
    const cov=new Map(idb.albums.map(a=>[a.id,a.cover]));
    ls.albums.forEach(a=>{if(!a.cover&&cov.get(a.id))a.cover=cov.get(a.id)});
    for(const [k,e] of Object.entries(ls.artists||{}))if(!e.photo&&idb.artists?.[k]?.photo&&!e.none)e.photo=idb.artists[k].photo;
    return ls;
  }
};
const S={albums:[], artists:{}, ui:{tab:'artists', open:[], lib:{sort:'added',dir:-1,filter:'All'}, art:{sort:'name',dir:1,filter:'All'}}};
let LOADED=false,saveT,warned=false;
// nothing is written until the saved data has been read back in, so an empty start can never overwrite it
function save(){if(!LOADED)return;clearTimeout(saveT);saveT=setTimeout(flush,250)}
async function flush(){
  clearTimeout(saveT);saveT=null;if(!LOADED)return;
  const v=JSON.parse(JSON.stringify(S));v.savedAt=Date.now();
  const okL=Store.lsSet(v),okI=await Store.idbSet(v);
  if(!okL&&!okI)toast('⚠ Couldn’t save on this device. Use Data → Save Backup now.');
  else if(!okI&&!warned){warned=true;toast('⚠ Saved, but this browser won’t keep covers and photos.')}
}
// save right away when the app is put away, rather than waiting
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&saveT)flush()});
addEventListener('pagehide',()=>{if(saveT)flush()});

/* ================= header / footer sizes ================= */
function measure(){
  document.documentElement.style.setProperty('--header-h',$('#app-header').offsetHeight+'px');
  document.documentElement.style.setProperty('--footer-h',$('#app-footer').hidden?'0px':$('#app-footer').offsetHeight+'px');
}
new ResizeObserver(measure).observe($('#app-header'));new ResizeObserver(measure).observe($('#app-footer'));

/* ================= artists ================= */
function artistMap(){
  const m=new Map();
  for(const a of S.albums){const n=(a.artist||'').trim()||'Unknown Artist',k=n.toLowerCase();
    if(!m.has(k))m.set(k,{name:n,albums:[]});m.get(k).albums.push(a);}
  return m;
}
function typeCounts(list){const c={};for(const a of list)c[a.type]=(c[a.type]||0)+1;
  return TYPES.filter(t=>c[t]).map(t=>`${c[t]} ${c[t]===1?t:TYPE_PL[t]}`).join(' · ')}

/* ================= sorting ================= */
const LIB_SORTS=[
  {k:'added',n:'Date added',d:'Newest first',def:-1},
  {k:'title',n:'Title',d:'A–Z, ignoring “The”, “A” and “An”',def:1},
  {k:'artist',n:'Artist',d:'By artist, then oldest release first',def:1},
  {k:'year',n:'Year',d:'Oldest first; no year last',def:1},
  {k:'length',n:'Length',d:'Longest first',def:-1},
  {k:'type',n:'Type',d:'Albums, LPs, EPs, then singles',def:1},
  {k:'genre',n:'Genre',d:'Grouped by genre, A–Z',def:1},
];
const ART_SORTS=[
  {k:'name',n:'Name',d:'A–Z, ignoring “The”',def:1},
  {k:'count',n:'Most releases',d:'Most in your library first',def:-1},
  {k:'length',n:'Most music',d:'Longest total running time first',def:-1},
  {k:'added',n:'Recently added',d:'Artist of your newest release first',def:-1},
];
const yr=a=>parseInt(a.year,10)||0;
function cmpAlb(k){
  const T=(a,b)=>sortKey(a.title).localeCompare(sortKey(b.title));
  return{
    added:(a,b)=>a.added-b.added,
    title:T,
    artist:(a,b)=>sortKey(a.artist).localeCompare(sortKey(b.artist))||(yr(a)||9999)-(yr(b)||9999)||T(a,b),
    year:(a,b)=>(yr(a)||9999)-(yr(b)||9999)||T(a,b),
    length:(a,b)=>total(a)-total(b)||T(a,b),
    type:(a,b)=>TYPES.indexOf(a.type)-TYPES.indexOf(b.type)||sortKey(a.artist).localeCompare(sortKey(b.artist))||(yr(a)||9999)-(yr(b)||9999),
    genre:(a,b)=>(a.genre?0:1)-(b.genre?0:1)||String(genresOf(a)[0]||'').toLowerCase().localeCompare(String(genresOf(b)[0]||'').toLowerCase())||sortKey(a.artist).localeCompare(sortKey(b.artist))||(yr(a)||9999)-(yr(b)||9999),
  }[k];
}
function groupOf(k,a){
  if(k==='artist')return a.artist||'Unknown Artist';
  if(k==='year'){const y=yr(a);return y?`${Math.floor(y/10)*10}s`:'No Year'}
  if(k==='type')return TYPE_PL[a.type];
  if(k==='genre')return genresOf(a)[0]||'No Genre';   // grouped under its main (first) genre
  return null;
}
let Q='';   // the search text for the tab on screen
function matchAlb(a,q){
  if(!q)return{ok:true};
  const h=[a.title,a.artist,a.genre,a.label,a.year,a.type].join(' ').toLowerCase();
  if(h.includes(q))return{ok:true};
  const t=(a.tracks||[]).find(x=>(x.t||'').toLowerCase().includes(q));
  return t?{ok:true,track:t.t}:{ok:false};
}

/* ================= rendering: tabs ================= */
function setTab(t){
  S.ui.tab=t;save();Q='';$('#sfq').value='';$('#sf-card').classList.remove('searching','has-q');
  $$('#tabs .tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));
  $('#row2').hidden=t==='data';$('#app-header').classList.toggle('bare',t==='data');
  $('#app-footer').hidden=t==='data';document.body.classList.toggle('no-foot',t==='data');
  measure();render();scrollTo(0,0);
}
function render(){({library:renderLib,artists:renderArtists,data:renderData})[S.ui.tab]();renderSf()}
function renderSf(){
  const t=S.ui.tab;if(t==='data')return;
  const u=t==='library'?S.ui.lib:S.ui.art,list=t==='library'?LIB_SORTS:ART_SORTS;
  $('#sf-filter').textContent=u.filter==='All'?'All':TYPE_PL[u.filter];
  $('#sf-sort').textContent=(list.find(s=>s.k===u.sort)||list[0]).n;
  $('#sf-dir').classList.toggle('up',u.dir===(list.find(s=>s.k===u.sort)||list[0]).def);
  $('#sfq').placeholder='Artists, titles, genres, songs';
}
function albMini(a,hit){
  const len=total(a),meta=[a.year,len?fmtLen(len):''].filter(Boolean).join(' · ');
  return `<div class="alb mini" data-id="${a.id}">${artHTML(a)}<div class="main"><div class="t">${esc(a.title||'Untitled')}</div>${hit?`<div class="hit">♪ ${esc(hit)}</div>`:`<div class="m">${esc(meta)}</div>`}</div><div class="ty" style="--tc:${TYPE_C[a.type]}"><span>${esc(a.type)}</span></div></div>`;
}
function albRow(a,hit,own){   // own: shown under its artist already, so the artist line is left off
  const len=total(a),n=(a.tracks||[]).length;
  const meta=[a.year,genresOf(a)[0],n?`${n} track${n===1?'':'s'}`:'',len?fmtLen(len):''].filter(Boolean).join(' · ');
  return `<div class="alb" data-id="${a.id}">${artHTML(a)}<div class="main"><div class="t">${esc(a.title||'Untitled')}</div>${own?'':`<div class="a">${esc(a.artist||'Unknown Artist')}</div>`}${hit?`<div class="hit">♪ ${esc(hit)}</div>`:`<div class="m">${esc(meta)||'&nbsp;'}</div>`}</div><div class="ty" style="--tc:${TYPE_C[a.type]}"><span>${esc(a.type)}</span></div></div>`;
}
function renderLib(){
  const u=S.ui.lib,q=Q.trim().toLowerCase();
  let list=S.albums.filter(a=>u.filter==='All'||a.type===u.filter).map(a=>({a,m:matchAlb(a,q)})).filter(x=>x.m.ok);
  const c=cmpAlb(u.sort);list.sort((x,y)=>c(x.a,y.a)*u.dir);
  let h='',last=null;
  for(const {a,m} of list){const g=groupOf(u.sort,a);if(g!==null&&g!==last){h+=`<div class="list-divider"><span>${esc(g)}</span></div>`;last=g}h+=albRow(a,m.track)}
  if(!S.albums.length)h=`<div class="empty">Your crate is empty.<br>Tap <b>Add New Album</b> to look one up.</div>`;
  else if(!list.length)h=`<div class="empty">Nothing matches${q?` “${esc(Q.trim())}”`:''}${u.filter!=='All'?` in ${TYPE_PL[u.filter]}`:''}.</div>`;
  $('#app').innerHTML=h;
}
const TRI_DN='<svg viewBox="0 0 40 40"><polygon points="10.4,11 29.6,11 20,27.6" fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"/></svg>';
const byYear=(a,b)=>(yr(a)||9999)-(yr(b)||9999)||sortKey(a.title).localeCompare(sortKey(b.title));
function renderArtists(){
  const u=S.ui.art,q=Q.trim().toLowerCase(),open=new Set(S.ui.open||[]);
  // while searching: artists whose name matches show all their albums; otherwise only the albums that match
  let list=[...artistMap().values()].map(x=>{
    const typed=x.albums.filter(a=>u.filter==='All'||a.type===u.filter);
    const nameHit=!q||x.name.toLowerCase().includes(q);
    const shown=nameHit?typed.map(a=>({a})):typed.map(a=>({a,m:matchAlb(a,q)})).filter(y=>y.m.ok).map(y=>({a:y.a,hit:y.m.track}));
    return{...x,shown,nameHit};
  }).filter(x=>x.shown.length);
  const N=(a,b)=>sortKey(a.name).localeCompare(sortKey(b.name));
  const c={name:N,count:(a,b)=>a.albums.length-b.albums.length||-N(a,b)*u.dir,
    length:(a,b)=>a.albums.reduce((t,x)=>t+total(x),0)-b.albums.reduce((t,x)=>t+total(x),0)||-N(a,b)*u.dir,
    added:(a,b)=>Math.max(...a.albums.map(x=>x.added))-Math.max(...b.albums.map(x=>x.added))}[u.sort];
  list.sort((a,b)=>c(a,b)*u.dir);
  let h='',last=null;
  for(const x of list){
    if(u.sort==='name'){const L=(sortKey(x.name)[0]||'#').toUpperCase(),g=/[A-Z]/.test(L)?L:'#';if(g!==last){h+=`<div class="list-divider"><span>${g}</span></div>`;last=g}}

function rankLk(list){
  const qa=nameNorm(lkQ.al||''),qs=trNorm(lkQ.al||''),qr=nameNorm(lkQ.ar||'');
  const tier=g=>{
    const t=nameNorm(g.title),ts=trNorm(g.title),a=(g['artist-credit']||[]).map(c=>nameNorm(c.name||c.artist?.name)).concat(nameNorm(creditOf(g['artist-credit'])));

// Deezer's API only lets a web page read it as JSONP (a script tag), so that's how it's asked
function jsonp(url,ms=9000){return new Promise((ok,no)=>{

async function togglePreview(i){
  const a=S.albums.find(x=>x.id===alId);if(!a)return;
  if(PV.id===a.id&&PV.i===i){if(PV.loading)return;if(PV.audio.paused)PV.audio.play().catch(()=>{});else{PV.audio.pause();stopPreview()}return}
  playPreview(a,i);
}
async function playPreview(a,i){
  PV.audio.pause();PV.id=a.id;PV.i=i;PV.loading=true;pvPaint();
  let url='';
  try{url=await previewFor(a,i)}catch(_){ if(PV.id===a.id&&PV.i===i){PV.loading=false;stopPreview();toast(navigator.onLine?'Couldn’t reach Deezer. Try again in a moment.':'Previews need a connection.')}return}
  if(PV.id!==a.id||PV.i!==i)return;   // another track was tapped meanwhile
  if(a.tracks[i])a.tracks[i].pv=!!url;
  if(!url){PV.none.add(a.id+':'+i);const r=pvRows().find(r=>+r.dataset.i===i);if(r)r.classList.add('none');
    toast('No preview on Deezer for this track');PV.loading=false;nextPreview();return}
  PV.audio.src=url;
  try{await PV.audio.play();PV.loading=false;pvPaint()}
  catch(_){PV.loading=false;stopPreview();toast('Couldn’t play the preview')}
}
// at the end of a preview, the next track plays; it stops after the last one
function nextPreview(){
  const a=S.albums.find(x=>x.id===PV.id);if(!a){stopPreview();return}
  let j=PV.i+1;while(j<a.tracks.length&&(PV.none.has(a.id+':'+j)||a.tracks[j].pv===false))j++;
  if(j<a.tracks.length&&alId===a.id&&stack.includes('#al-page'))playPreview(a,j);else stopPreview();
}
PV.audio.addEventListener('timeupdate',()=>{if(PV.id!==alId)return;const r=pvRows().find(r=>+r.dataset.i===PV.i);
  if(r&&PV.audio.duration)r.style.setProperty('--p',Math.min(1,PV.audio.currentTime/PV.audio.duration))});
PV.audio.addEventListener('ended',nextPreview);
PV.audio.addEventListener('error',()=>{if(PV.id&&!PV.loading){PV.albums.delete(PV.id);stopPreview();toast('That preview didn’t load. Tap it again.')}});

// checks Deezer for every track of an album, one album at a time in the background, and marks which have a preview
let pvChain=Promise.resolve();
function checkPreviews(id){
  pvChain=pvChain.then(async()=>{
    const a=S.albums.find(x=>x.id===id);if(!a||!a.tracks||!a.tracks.length||a.pvChecked)return;
    try{await dzAlbumTracks(a)}catch(_){return}   // offline or Deezer down: left for next time
    for(let i=0;i<a.tracks.length;i++){
      if(!S.albums.includes(a))return;            // deleted meanwhile
      try{a.tracks[i].pv=!!(await previewFor(a,i))}catch(_){return}
      await sleep(120);
    }
    a.pvChecked=Date.now();save();
    if(alId===a.id&&stack.includes('#al-page')&&!PV.id)renderAlbum();
    else if(alId===a.id){pvRows().forEach(r=>{const t=a.tracks[+r.dataset.i];if(t&&t.pv===false)r.classList.add('none')});const nt=$('#al-body .pv-note');if(nt)nt.outerHTML=pvNote(a)}
  }).catch(()=>{});
}
function pvNote(a){
  const t=a.tracks||[],have=t.filter(x=>x.pv).length;
  if(!a.pvChecked)return '<span class="pv-note">Tap a track to hear a 30-second preview from Deezer.</span>';
  return `<span class="pv-note">${have===t.length?`All ${t.length} tracks have`:have?`${have} of ${t.length} tracks have`:'No tracks have'} a 30-second Deezer preview.${have?' Tap one to listen.':''}</span>`;
}

let PH=[];
async function findPhotos(){
  const name=arName,st=$('#ph-st');st.hidden=false;st.classList.remove('err');st.innerHTML='<span class="spin"></span>&nbsp; Looking for photos…';$('#ph-res').innerHTML='';
  const [dz,ad,wk]=await Promise.allSettled([deezerArtists(name),adbPhotos(name),wikiPhoto(name)]);
  if(name!==arName)return;
  PH=[...(ad.status==='fulfilled'?ad.value:[]),...(wk.status==='fulfilled'&&wk.value?[wk.value]:[]),...(dz.status==='fulfilled'?dz.value:[])];
  if(!PH.length){st.classList.add('err');st.textContent=[dz,ad,wk].every(x=>x.status==='rejected')?'Couldn’t reach Deezer, TheAudioDB or MusicBrainz. Try again in a moment.':'No photos found. You can choose one of your own.';return}
  st.hidden=true;
  $('#ph-res').innerHTML=`<div class="sr-sec">Pick a photo<span>${PH.length}</span></div>`+PH.map((x,i)=>`<button type="button" class="lk-row ph-row" data-i="${i}"><div class="art ph" style="--c:${clothOf('artist|'+x.name)}"><span>${esc(initials(x.name))}</span><img alt="" loading="lazy" src="${esc(x.thumb)}" onerror="this.remove()"></div><span class="tx"><b>${esc(x.name)}</b><small>${esc(x.note)}</small></span><span class="tg">Use</span></button>`).join('');
}

/* ================= backup ================= */
async function exportBackup(){
  const data=JSON.stringify({app:'my-music-chronography',v:2,saved:new Date().toISOString(),albums:S.albums,artists:S.artists});
  const name=`my-music-chronography-backup-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([data],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){
    try{await navigator.share({files:[file],title:'My Music Chronography backup'});return}catch(e){if(e.name==='AbortError')return}}
  const u=URL.createObjectURL(file),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
  toast('Backup saved');
}
$('#imp-file').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());const list=Array.isArray(j)?j:j.albums;if(!Array.isArray(list))throw 0;
    let add=0,upd=0;for(const a of list){if(!a||!a.title)continue;a.type=TYPES.includes(a.type)?a.type:'Album';a.tracks=Array.isArray(a.tracks)?a.tracks:[];a.added=a.added||Date.now();a.id=a.id||uid();
      const i=S.albums.findIndex(x=>x.id===a.id);if(i>-1){S.albums[i]=a;upd++}else{S.albums.push(a);add++}}
    if(j.artists&&typeof j.artists==='object')for(const [k,v] of Object.entries(j.artists))if(v&&v.photo&&!(S.artists[k]&&S.artists[k].photo))S.artists[k]=v;
    save();render();toast(`Imported: ${add} added, ${upd} updated`)}
  catch(_){toast('That file isn’t a My Music Chronography backup')}});

/* ================= start ================= */
(async()=>{
  const d=await Store.load();
  if(d&&Array.isArray(d.albums)){S.albums=d.albums;S.artists=d.artists||{};if(d.ui)S.ui={...S.ui,...d.ui,lib:{...S.ui.lib,...d.ui.lib},art:{...S.ui.art,...d.ui.art}}}
  LOADED=true;
  // ask the browser to treat this app's storage as permanent (not cleared to free up space)
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
  setTab(['artists','library','data'].includes(S.ui.tab)?S.ui.tab:'artists');
  if(S.albums.length)flush();   // writes both copies, so data saved by the old version gets its localStorage copy too
  for(const x of artistMap().values())autoPhoto(x.name);   // any artist still without a photo (tried at most once a week)
  for(const a of S.albums)if(!a.pvChecked)checkPreviews(a.id);   // albums added before preview checks, or while offline
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
